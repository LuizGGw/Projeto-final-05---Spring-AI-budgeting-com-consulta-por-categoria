spring.application.name=budgeting-ai

# --- Database (H2 in-memory for local development/tests) ---
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true

# --- Spring AI / OpenAI ---
# The API key is read from the OPENAI_API_KEY environment variable.
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model used to interpret the voice command and decide which tool to call
spring.ai.openai.chat.options.model=gpt-4o-mini

# Speech-to-text (Whisper)
spring.ai.openai.audio.transcription.options.model=whisper-1

# Text-to-speech
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.speech.options.voice=alloy
spring.ai.openai.audio.speech.options.response-format=mp3

server.port=8080
